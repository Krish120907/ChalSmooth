<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChalSmooth — Intelligent Pothole Detection & Comfort Navigation</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="AI-powered road roughness monitoring, 50Hz smartphone IMU pothole detection, and Lagrangian comfort-prioritized navigation routing." />
  <meta name="keywords" content="pothole detection, road roughness, IMU sensing, comfort routing, smart city navigation" />
  <meta name="theme-color" content="#080c16" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/navigation.css" />
  <link rel="stylesheet" href="css/studio.css" />
  <link rel="stylesheet" href="css/hud.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <!-- Ambient Background Mesh -->
  <div class="bg-mesh"></div>

  <div id="app">
    <!-- Top App Header -->
    <header class="app-header">
      <!-- Brand Section -->
      <div class="brand-section">
        <div class="brand-logo-glow">🛡️</div>
        <div class="brand-title-wrap">
          <div class="brand-title">
            ChalSmooth
            <span class="brand-badge">AI SENSING</span>
          </div>
          <div class="brand-subtitle">Comfort Routing & Pothole Shield</div>
        </div>
      </div>

      <!-- Navigation Tabs (18 Parameters Matrix) -->
      <nav class="nav-tabs-container">
        <button class="nav-tab-btn active" data-tab="dashboard">
          <span class="tab-icon">🏠</span>
          <span>Home Dashboard</span>
        </button>
        <button class="nav-tab-btn" data-tab="map">
          <span class="tab-icon">🗺️</span>
          <span>Interactive Map</span>
        </button>
        <button class="nav-tab-btn" data-tab="navigation">
          <span class="tab-icon">🧭</span>
          <span>Comfort Navigator</span>
        </button>
        <button class="nav-tab-btn" data-tab="studio">
          <span class="tab-icon">📊</span>
          <span>Sensor & ML Studio</span>
        </button>
        <button class="nav-tab-btn" data-tab="hud">
          <span class="tab-icon">🚗</span>
          <span>In-Car HUD</span>
        </button>
        <button class="nav-tab-btn" data-tab="profile">
          <span class="tab-icon">👤</span>
          <span>Profile & History</span>
        </button>
      </nav>

      <!-- Right Header Actions -->
      <div class="header-actions">
        <!-- Vehicle Profile Selector -->
        <div class="vehicle-selector">
          <span>🚙</span>
          <select id="header-vehicle-select">
            <option value="car">Hatchback / Sedan</option>
            <option value="suv">SUV / Crossover</option>
            <option value="scooter">Two-Wheeler / Scooter</option>
            <option value="rickshaw">Auto-Rickshaw</option>
          </select>
        </div>

        <!-- Quick Report Pothole Button (Parameter 5) -->
        <button class="btn-report-pothole" id="btn-header-report">
          <span>📸</span> Report Pothole
        </button>

        <!-- User Profile Pill (Parameter 17) -->
        <div class="user-pill-btn" id="btn-header-profile" title="View Profile & Karma XP">
          <span class="user-avatar">👩‍💻</span>
          <span class="user-karma-badge">840 XP</span>
        </div>
      </div>
    </header>

    <!-- Main Views Container -->
    <main class="main-view-container">
      <!-- 1. Home Dashboard View (Parameters 1, 10) -->
      <div class="view-panel active" id="view-dashboard"></div>

      <!-- 2. Interactive Map View (Parameters 2, 3, 4, 11, 12) -->
      <div class="view-panel" id="view-map"></div>

      <!-- 3. Comfort Navigator View (Parameters 15, 16) -->
      <div class="view-panel" id="view-navigation"></div>

      <!-- 4. Live Sensor & ML Detection Studio -->
      <div class="view-panel" id="view-studio"></div>

      <!-- 5. In-Car Driver HUD View -->
      <div class="view-panel" id="view-hud"></div>

      <!-- 6. User Profile & Report History View (Parameters 17, 18) -->
      <div class="view-panel" id="view-profile"></div>
    </main>

    <!-- Modal & Drawer Mount Roots -->
    <div id="report-modal-root"></div>
    <div id="details-drawer-root"></div>

    <!-- Live Toast Notifications Container (Parameter 16) -->
    <div id="toast-container"></div>
  </div>

  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
